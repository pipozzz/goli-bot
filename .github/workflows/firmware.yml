name: Firmware

# Builds the firmware on every push and pull request. On main it also publishes the web installer
# (web/index.html + the merged image) and the 3D viewer to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini', '.github/workflows/firmware.yml') }}
      - name: Install PlatformIO
        # esptool 5.0.0-dev1 from the pinned platform breaks with click >= 8.2
        run: pip install platformio==6.1.18 click==8.1.7
      - name: Build
        run: pio run -e goli -d firmware
      - name: Assemble the site
        run: web/build_site.sh site
      - uses: actions/upload-artifact@v4
        with:
          name: goli-firmware
          path: site/firmware/goli-firmware.bin
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
