; Goli desk bot firmware for the Waveshare ESP32-S3-Touch-AMOLED-1.75
[env:goli]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
build_src_filter = +<*> -<snapshot.cpp>
; also writes goli-firmware.bin for the web installer (docs/install)
extra_scripts =
    pre:tools/version.py
    post:tools/merge_bin.py
lib_deps =
    lvgl/lvgl@8.4.0
    moononournation/GFX Library for Arduino@1.6.4
    lewisxhe/SensorLib@0.3.1
    bblanchon/ArduinoJson@7.4.2
    lewisxhe/XPowersLib@0.2.6

; Renders every expression to PNG on your computer (no board needed):
;   pio run -e snapshot && .pio/build/snapshot/program && python3 tools/sheet.py
[env:snapshot]
platform = native
build_src_filter = +<face.cpp> +<setup_ui.cpp> +<selftest_ui.cpp> +<screens.cpp> +<font_clock.c> +<snapshot.cpp>
build_flags = -DLV_CONF_INCLUDE_SIMPLE -I include -I tools/shim -lm
lib_deps = lvgl/lvgl@8.4.0
lib_compat_mode = off
